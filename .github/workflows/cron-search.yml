# Daily LegiScan full-text search sweep — the recall-first discovery loop.
# Once a day: bills rarely change intra-day and LegiScan's free key allows only
# 10,000 queries/month since 2026-10-01 (going over blocks all bill data until
# the 1st, and extra keys are forbidden). The daily pipeline also runs the
# search adapter; it reuses this sweep's cached search results, and both only
# getBill bills whose change_hash moved. See /admin/legiscan-usage. The endpoint skips
# itself if a pipeline run is already in progress, so overlap can't pile up.
# Requires repo secrets API_BASE_URL and ADMIN_TOKEN.
name: Search sweep

on:
  schedule:
    # 06:15 UTC — well clear of the 10:00 UTC daily pipeline.
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /admin/cron-search
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ] || [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "Missing API_BASE_URL or ADMIN_TOKEN repo secret" >&2
            exit 1
          fi
          curl -sS --fail-with-body --max-time 30 \
            "${API_BASE_URL%/}/admin/cron-search?token=${ADMIN_TOKEN}"

      - name: Check out repo for failure notification
        if: failure()
        uses: actions/checkout@v4

      - name: Notify Chip on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
